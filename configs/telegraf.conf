# Telegraf collection
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  # collection_jitter = "0s"
  # flush_jitter = "0s"

# Prometheus integration
[[outputs.prometheus_client]]
  listen = ":9273"
#  expiration_interval = "0s"
  export_timestamp = true
  metric_version = 2

[[inputs.internal]]
  collect_memstats = true

################################### SNMP Input
[[inputs.snmp]]
  agents = [
    "pe1:161",  # PE1
    "pe2:161",  # PE2
    "p1:161",  # P1
    "p2:161",  # P2
    "p3:161",  # P3
    "rr:161"  # RR
  ]
  version = 2
  community = "public"
  interval = "30s"
  timeout = "5s"
  retries = 1

  # Define OIDs

  [[inputs.snmp.table]]
    name = "interface"
    
    [[inputs.snmp.table.field]] # interface name as tag
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]] # Up/Down state
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"

  [[inputs.snmp.field]]
  name = "hrStorageSize"
  oid = "1.3.6.1.2.1.25.2.3.1.5.1"  # Total RAM installed (KB)

  [[inputs.snmp.field]]
  name = "hrStorageUsed"
  oid = "1.3.6.1.2.1.25.2.3.1.6.1"  # Used RAM (KB)

  [[inputs.snmp.field]]
  name = "hrProcessorLoad"
  oid = "1.3.6.1.2.1.25.3.3.1.2.1"  # CPU

  [[inputs.snmp.table]]
    name = "snmp_bgp"
      
    [[inputs.snmp.table.field]]
      name = "bgpPeerRemoteAddr"
      oid = ".1.3.6.1.2.1.15.3.1.7" # IP address of the peer
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "bgpPeerState"
      oid = ".1.3.6.1.2.1.15.3.1.2" # 1=Idle, 6=Established

    [[inputs.snmp.table.field]]
      name = "bgpPeerFsmEstablishedTime"  # resets on flap
      oid = ".1.3.6.1.2.1.15.3.1.16"

[[inputs.snmp.table]]
    name = "snmp_juniper_bgp_prefixes"
    index_as_tag = true 

    [[inputs.snmp.table.field]]
      name = "AFI" #AFI (1 = IPv4, 2 = IPv6, etc.)
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "SAFI" #SAFI (1 = Unicast, 128 = VPN, etc.)
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "jnxBgpM2PrefixInPrefixes"
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.7"

    [[inputs.snmp.table.field]]
      name = "jnxBgpM2PrefixInPrefixesAccepted"
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.8"

    [[inputs.snmp.table.field]]
      name = "jnxBgpM2PrefixOutPrefixes"
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.10"

    [[inputs.snmp.table.field]]
      name = "jnxBgpM2PrefixInPrefixesActive"
      oid = ".1.3.6.1.4.1.2636.5.1.1.2.6.2.1.11"

  [[inputs.snmp.table]]
    name = "snmp_juniper_ldp"
    index_as_tag = true # captures the peer ID string

    [[inputs.snmp.table.field]]
      name = "jnxMplsLdpSesState"
      oid = ".1.3.6.1.4.1.2636.3.36.1.3.3.1.2"

    [[inputs.snmp.table.field]]
      name = "jnxMplsLdpSesStateLastChange"
      oid = ".1.3.6.1.4.1.2636.3.36.1.3.3.1.1"

  [[inputs.snmp.table]]
    name = "snmp_mpls" #label table
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "mplsLdpSessionState"
      oid = ".1.3.6.1.2.1.10.166.4.1.3.3.1.2"

    [[inputs.snmp.table.field]]
      name = "mplsLdpSessionStateLastChange"
      oid = ".1.3.6.1.2.1.10.166.4.1.3.3.1.1" 

    [[inputs.snmp.table.field]]
      name = "mplsL3VpnVrfOperStatus"
      oid = ".1.3.6.1.2.1.10.166.11.1.2.2.1.6"

[[inputs.snmp_trap]] # SNMP trap
  service_address = "udp://:1620"
  [inputs.snmp_trap.tags]
    mechanism = "snmp_trap"

################################### gNMI Input over OpenConfig paths

[[inputs.gnmi]]
  addresses = [
    "pe1:32767",  # PE1
    "pe2:32767",  # PE2
    "p1:6030",   # P1
    "p2:6030",   # P2
    "p3:6030",   # P3
    "rr:6030"   # RR
  ]

  username = "admin"
  password = "admin"
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]]
    name = "interfaces_telemetry"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_cpu"
    origin = "openconfig"
    path = "/components/component/cpu/utilization/state/instant"
    subscription_mode = "sample"
    sample_interval = "10s"


  # [[inputs.gnmi.subscription]]
  #   name = "gnmi_oper_status"
  #   origin = "openconfig"
  #   path = "/interfaces/interface/state/oper-status"
  #   subscription_mode = "on_change"



[[inputs.gnmi]] #Arista-only
  addresses = [
    "p1:6030",   # P1
    "p2:6030",   # P2
    "p3:6030",   # P3
    "rr:6030"   # RR
  ]

  username = "admin"
  password = "admin"
  insecure_skip_verify = true


  [[inputs.gnmi.subscription]]
    name = "gnmi_ldp_state_arista"
    origin = "eos_native"
    path = "/Sysdb/mpls/ldp/ldpStatusColl/status/default/ldpSessionStatusColl/sessionStatus"
    subscription_mode = "on_change"
    
  [[inputs.gnmi.subscription]]
    name = "gnmi_bgp_state_arista_native"
    origin = "eos_native"
    path = "/Sysdb/routing/bgp/export/vrfBgpPeerAfiSafiStateTable"
    subscription_mode = "on_change"

[[inputs.gnmi]] #Juniper-only
  addresses = [
    "pe1:32767",  # PE1
    "pe2:32767",  # PE2
  ]

  username = "admin"
  password = "admin"
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]] #BGP
    name = "gnmi_bgp_prefixes"        # gNMI-exclusive capability
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_bgp_messages"
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/messages"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_ldp_state"
    origin = "openconfig"
    path = "/network-instances/network-instance/mpls/signaling-protocols/ldp/neighbors/neighbor/state/session-state"
    subscription_mode = "on_change"

  # [[inputs.gnmi.subscription]]
  #   name = "gnmi_vrf_ipv4_prefixes"
  #   origin = "openconfig"
  #   path = "/network-instances/network-instance/protocols/protocol/bgp/rib/afi-safis/afi-safi/ipv4-unicast"
  #   subscription_mode = "sample"
  #   sample_interval = "15s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_bgp_state"
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"
    subscription_mode = "on_change"

[[processors.enum]]
  namepass = ["gnmi_bgp_state"]
  [[processors.enum.mapping]]
    field = "session_state"
    dest  = "session_state_int"
    [processors.enum.mapping.value_mappings]
      "IDLE" = 1
      "CONNECT" = 2
      "ACTIVE" = 3
      "OPENSENT" = 4
      "OPENCONFIRM" = 5
      "ESTABLISHED" = 6

  # [[processors.enum.mapping]]
  #   field = "oper_status"
  #   dest  = "oper_status_int"
  #   [processors.enum.mapping.value_mappings]
  #     "UP" = 1
  #     "DOWN" = 2

[[processors.enum]]
  namepass = ["gnmi_ldp_state"]
  [[processors.enum.mapping]]
    field = "session_state"
    dest  = "ldp_session_state_int"
    [processors.enum.mapping.value_mappings]
      "NON_EXISTENT" = 1
      "INITIALIZED" = 2
      "OPENREC" = 3
      "OPENSENT" = 4
      "OPERATIONAL" = 5

[[processors.unpivot]]
  namepass = ["gnmi_ldp_state_arista"]
  tag_key = "arista_peer_id"
  value_key = "raw_state_string"

[[processors.enum]]
  namepass = ["gnmi_ldp_state_arista"]
  [[processors.enum.mapping]]
    field = "*_sessionState_storedValue"
    dest  = "ldp_session_state_int"
    [processors.enum.mapping.value_mappings]
      "stateNonExist" = 1
      "stateInitialized" = 2
      "stateOpenRecv" = 3
      "stateOpenSent" = 4
      "stateOperational" = 5

[[processors.enum]]
  namepass = ["gnmi_bgp_state_arista_native"]
  [[processors.enum.mapping]]
    field = "bgpPeerAfiSafiState_state"
    dest  = "session_state_int"
    [processors.enum.mapping.value_mappings]
      "Idle" = 1
      "Connect" = 2
      "Active" = 3
      "OpenSent" = 4
      "OpenConfirm" = 5
      "Established" = 6


