# Telegraf collection
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000

# Prometheus integration
[[outputs.prometheus_client]]
  listen = ":9273"

################################### SNMP Input
[[inputs.snmp]]
  agents = [
    "pe1:161",  # PE1
    "pe2:161",  # PE2
    "p1:161",  # P1
    "p2:161",  # P2
    "p3:161",  # P3
    "rr:161"  # RR
  ]
  version = 2
  community = "public"
  interval = "30s"
  # Define OIDs
  [[inputs.snmp.field]] # hostname as tag to Grafana
      name = "hostname"
      oid = ".1.3.6.1.2.1.1.5.0"
      is_tag = true

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    
    [[inputs.snmp.table.field]] # interface name as tag
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]] # Up/Down state
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]] # inbound Traffic
      name = "ifInOctets"
      oid = ".1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]] # outbound Traffic
      name = "ifOutOctets"
      oid = ".1.3.6.1.2.1.2.2.1.16"

[[inputs.snmp]]
  agents = [
    "pe1:161",  # PE1
    "pe2:161",  # PE2
  ]
  version = 2
  community = "public"
  interval = "30s"

  [[inputs.snmp.field]]
    name = "jnxOperatingCPU"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.8.9.1.0.0" # CPU for Routing Engine 0

[[inputs.snmp]]
  agents = [
    "p1:161",   # P1
    "p2:161",   # P2
    "p3:161",   # P3
    "rr:161"   # RR
  ]
  version = 2
  community = "public"
  interval = "30s"

  [[inputs.snmp.field]]
    name = "ssCpuIdle"
    oid = "1.3.6.1.4.1.2021.11.11.0" # ssCpuIdle

################################### gNMI Input over OpenConfig paths

[[inputs.gnmi]]
  addresses = [
    "pe1:32767",  # PE1
    "pe2:32767",  # PE2
    "p1:6030",   # P1
    "p2:6030",   # P2
    "p3:6030",   # P3
    "rr:6030"   # RR
  ]

  username = "admin"
  password = "admin"
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]]
    name = "interfaces_telemetry"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
      name = "gnmi_cpu"
      origin = "openconfig"
      path = "/components/component/cpu/utilization/state/instant"
      subscription_mode = "sample"
      sample_interval = "10s"

