################################### gNMI Input over OpenConfig paths

[[inputs.gnmi]]
  addresses = [
    "pe1:32767",  # PE1
    "pe2:32767",  # PE2
    "p1:6030",   # P1
    "p2:6030",   # P2
    "p3:6030",   # P3
    "rr:6030"   # RR
  ]

  username = "admin"
  password = "admin"
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]]
    name = "interfaces_telemetry"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_cpu"
    origin = "openconfig"
    path = "/components/component/cpu/utilization/state/instant"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "interfaces_status"
    origin = "openconfig"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_memory"
    origin = "openconfig"
    path = "/system/memory/state"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "gnmi_bgp"
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state"
    subscription_mode = "on_change" #event-driven

  [[inputs.gnmi.subscription]]
    name = "gnmi_bgp_prefixes"        # gNMI-exclusive capability
    origin = "openconfig"
    path = "/network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes"
    subscription_mode = "sample"
    sample_interval = "10s"