# Telegraf collection
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"

# Prometheus integration
[[outputs.prometheus_client]]
  listen = ":9273"
#  expiration_interval = "0s"
  export_timestamp = true
  metric_version = 2

################################### SNMP Input
[[inputs.snmp]]
  agents = [
    "pe1:161",  # PE1
    "pe2:161",  # PE2
    "p1:161",  # P1
    "p2:161",  # P2
    "p3:161",  # P3
    "rr:161"  # RR
  ]
  version = 2
  community = "public"
  interval = "30s"
  timeout = "5s"
  retries = 1

  # Define OIDs
  [[inputs.snmp.field]] # hostname as tag to Grafana
      name = "hostname"
      oid = ".1.3.6.1.2.1.1.5.0"
      is_tag = true

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    
    [[inputs.snmp.table.field]] # interface name as tag
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    [[inputs.snmp.table.field]] # Up/Down state
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"

  [[inputs.snmp.field]]
  name = "hrStorageSize"
  oid = "1.3.6.1.2.1.25.2.3.1.5.1"  # Total RAM installed (KB)

  [[inputs.snmp.field]]
  name = "hrStorageUsed"
  oid = "1.3.6.1.2.1.25.2.3.1.6.1"  # Used RAM (KB)

  [[inputs.snmp.field]]
  name = "hrProcessorLoad"
  oid = "1.3.6.1.2.1.25.3.3.1.2.1"  # CPU

  [[inputs.snmp.table]]
      name = "snmp_bgp"
      inherit_tags = ["hostname"]
      
      [[inputs.snmp.table.field]]
        name = "bgpPeerState"
        oid = ".1.3.6.1.2.1.15.3.1.2" # 1=Idle, 6=Established
        
      [[inputs.snmp.table.field]]
        name = "bgpPeerRemoteAddr"
        oid = ".1.3.6.1.2.1.15.3.1.7" # IP address of the peer
        is_tag = true

      [[inputs.snmp.table.field]]
        name = "bgpPeerFsmEstablishedTime"  # resets on flap
        oid = ".1.3.6.1.2.1.15.3.1.16"

[[inputs.snmp_trap]] # SNMP trap
  service_address = "udp://:1620"
  [inputs.snmp_trap.tags]
    mechanism = "snmp_trap"

