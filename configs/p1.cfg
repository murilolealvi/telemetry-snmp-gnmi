! Jinja2 template for P-Routers

hostname p1
username admin privilege 15 secret admin
ip routing
service routing protocols model multi-agent

! Telemetry
management api gnmi
   transport grpc default
   provider eos-native
snmp-server community public ro
snmp-server host  traps version 2c public udp-port 1620
snmp-server enable traps snmp link-down link-up
snmp-server enable traps ospf
snmp-server enable traps bgp
snmp-server enable traps mpls ldp

! LDP Configuration
mpls ip
mpls ldp
   router-id interface Loopback0
   transport-address interface Loopback0
   no shutdown
! Interfaces Configuration
interface Ethernet1
   no switchport
   ip address 10.1.1.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Ethernet2
   no switchport
   ip address 10.1.12.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Ethernet3
   no switchport
   ip address 10.1.13.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Loopback0
   ip address 10.0.0.30/32
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
! OSPF Underlay
router ospf 1
   router-id 10.0.0.30
   passive-interface Loopback0
!
end