! Jinja2 template for P-Routers
!
hostname p1
username admin privilege 15 secret admin
ip routing
! Telemetry
management api gnmi
   transport grpc default
!
! Interfaces Configuration
interface Ethernet1
   no switchport
   ip address 10.1.1.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.1.12.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   no switchport
   ip address 10.1.13.1/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 10.0.0.13/32
   ip ospf area 0.0.0.0
!
! OSPF Underlay
router ospf 1
   router-id 10.0.0.13
   passive-interface Loopback0
!
end