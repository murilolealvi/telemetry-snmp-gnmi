# Jinja2 template for PE-Routers

# System
system {
    host-name pe1;
    
    root-authentication {
        encrypted-password "$1$salt$IEd.dPRrJY41NYnnaBENQ1";
    }
    
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$1$salt$IEd.dPRrJY41NYnnaBENQ1";
            }
        }
    }
}

# Interface Configuration
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.10/32;
            }
            family mpls;
        }
    }
    ge-0/0/2 {
        description "to P-router";
        unit 0 {
            family inet {
                address 10.1.1.0/31;
            }
            family mpls;
        }
    }
    ge-0/0/1 {
        description "to CE";
        unit 0 {
            family inet {
                address 192.168.11.1/24;
            }
        }
    }
}

# Protocols Configuration
routing-options {
    router-id 10.0.0.10;
    autonomous-system 65000;
}

protocols {
    ospf {
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface ge-0/0/2.0 {
                interface-type p2p;
            }
        }
    }
    mpls {
        interface ge-0/0/2.0;
    }
    ldp {
        track-igp-metric;
        interface ge-0/0/2.0;
        interface lo0.0;
    }
    bgp {
        group IBGP-RR {
            type internal;
            local-address 10.0.0.10;
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            neighbor 10.0.0.100;
        }
    }
}