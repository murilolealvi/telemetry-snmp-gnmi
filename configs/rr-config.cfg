! RR Configuration
!
hostname rr
username admin privilege 15 secret admin
!
! ---------------------------------------------------------
! 1. Telemetry
! ---------------------------------------------------------
! Enable the gNMI on the default port
management api gnmi
   transport grpc default
!
! ---------------------------------------------------------
! 2. Interface Configuration
! ---------------------------------------------------------
interface Ethernet1
   description to PE1
   no switchport
   ip address 10.1.10.0/30
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description to PE2
   no switchport
   ip address 10.1.20.0/30
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   description BGP RouterID
   ip address 10.0.0.100/32
   ip ospf area 0.0.0.0
!
! ---------------------------------------------------------
! 3. OSPF Underlay
! ---------------------------------------------------------
router ospf 1
   router-id 10.0.0.100
   passive-interface Loopback0
!
! ---------------------------------------------------------
! 4. BGP Overlay (AS 65000)
! ---------------------------------------------------------
router bgp 65000
   router-id 10.0.0.100
   
   ! iBGP Group
   neighbor IBGP-PE peer group
   neighbor IBGP-PE remote-as 65000
   neighbor IBGP-PE update-source Loopback0
   neighbor IBGP-PE route-reflector-client
   neighbor IBGP-PE send-community
   
   ! Peering with PE1 and PE2 Loopbacks
   neighbor 10.0.0.11 peer group IBGP-PE
   neighbor 10.0.0.12 peer group IBGP-PE
!
end