! Jinja2 template for P-Routers
!
hostname p3
management api gnmi
   transport grpc default
!
! Interfaces Configuration
interface Ethernet1
   no switchport
   ip address 10.1.23.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.1.13.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   no switchport
   ip address 127.0.0.1/8
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 10.0.0.15/32
   ip ospf area 0.0.0.0
!
! OSPF Underlay
router ospf 1
   router-id 10.0.0.15
   passive-interface Loopback0
!
end