! Jinja2 template for P-Routers

hostname p3
username admin privilege 15 secret admin
ip routing
service routing protocols model multi-agent

! Telemetry
management api gnmi
   transport grpc default
   provider openconfig
snmp-server community public ro

! LDP Configuration
mpls ip
mpls ldp
   router-id interface Loopback0
   transport-address interface Loopback0
   no shutdown
! Interfaces Configuration
interface Ethernet1
   no switchport
   ip address 10.1.23.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Ethernet2
   no switchport
   ip address 10.1.13.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Ethernet3
   no switchport
   ip address 127.0.0.1/8
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
interface Loopback0
   ip address 10.0.0.50/32
   ip ospf area 0.0.0.0
   mpls ip
   mpls ldp interface
!
! OSPF Underlay
router ospf 1
   router-id 10.0.0.50
   passive-interface Loopback0
!
end